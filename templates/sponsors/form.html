{% extends 'base.html' %}
{% block title %}{% if object %}تعديل كافل{% else %}إضافة كافل{% endif %}{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        {% if object %}تعديل بيانات {{ object.nom }}{% else %}إضافة كافل جديد{% endif %}
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% load crispy_forms_tags %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary mt-3">حفظ</button>
        </form>
    </div>
</div>
{% endblock %}
